<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Бизнес-Империя</title>
  <link rel="icon" href="assets/icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: linear-gradient(180deg, #0d3b2e 0%, #0b2a21 55%, #081f19 100%);
      color: #f0fdf4;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      touch-action: manipulation;
      overflow-x: hidden;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 12px 14px 110px; }

    header { text-align: center; margin-bottom: 10px; }
    .money {
      font-size: 42px; font-weight: 800; color: #fde047;
      text-shadow: 0 2px 12px rgba(253, 224, 71, .35);
      line-height: 1.1;
    }
    .money small { font-size: 20px; color: #facc15; }
    .total { font-size: 13px; color: #86efac; margin-top: 2px; }
    .pills { display: flex; justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .pill {
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
      background: #166534; border: 1px solid #22c55e; color: #bbf7d0; display: none;
    }
    .pill.show { display: inline-block; }
    .pill.gold { background: #713f12; border-color: #f59e0b; color: #fef3c7; }

    .tap-wrap { position: relative; text-align: center; margin: 10px 0 14px; }
    .tap-btn {
      width: 190px; height: 190px; border-radius: 50%;
      border: 5px solid #f59e0b;
      background: radial-gradient(circle at 32% 28%, #fbbf24, #f59e0b 55%, #b45309);
      color: #451a03;
      font-size: 22px; font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 34px rgba(245, 158, 11, .45), inset 0 -8px 18px rgba(0,0,0,.25);
      transition: transform .07s ease;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .tap-btn:active { transform: scale(.93); }
    .tap-btn .ico { font-size: 58px; line-height: 1; }
    .tap-btn .ico .tap-ico { width: 64px; height: 64px; display: block; margin: 0 auto; }
    .tap-btn .lbl { margin-top: 6px; font-size: 15px; }
    .float-num {
      position: absolute; left: 50%; top: 40%;
      font-size: 22px; font-weight: 800; color: #fde047;
      text-shadow: 0 1px 4px rgba(0,0,0,.6);
      pointer-events: none;
      animation: floatUp .8s ease-out forwards;
      z-index: 5;
    }
    @keyframes floatUp {
      from { transform: translate(-50%, 0); opacity: 1; }
      to { transform: translate(-50%, -70px); opacity: 0; }
    }

    .daily-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 14px 16px;
      background: linear-gradient(90deg, #713f12, #92400e);
      border: 1px solid #f59e0b; border-radius: 14px;
      color: #fef3c7; font-size: 16px; font-weight: 700; cursor: pointer;
      margin-bottom: 12px;
    }
    .daily-btn span.d { color: #fde047; }
    .daily-btn:disabled { opacity: .6; cursor: default; }

    .click-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #0f3328; border: 1px solid #1e563f; border-radius: 14px;
      padding: 12px 14px; margin-bottom: 12px;
    }
    .click-row .t { font-size: 15px; font-weight: 700; }
    .click-row .s { font-size: 12px; color: #86efac; margin-top: 2px; }
    .buy-btn {
      min-width: 128px; padding: 10px 12px;
      background: linear-gradient(180deg, #16a34a, #15803d);
      border: 1px solid #22c55e; border-radius: 12px;
      color: #f0fdf4; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 3px 10px rgba(34,197,94,.25);
    }
    .buy-btn:disabled { background: #1c2e27; border-color: #2d4a3d; color: #6b8f80; box-shadow: none; }

    .biz-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .biz-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #0f3328; border: 1px solid #1e563f; border-radius: 14px;
      padding: 10px 12px;
    }
    .biz-row .e { font-size: 34px; line-height: 1; }
    .biz-row .e .biz-ico { width: 44px; height: 44px; display: block; }
    .biz-info { flex: 1; margin-left: 12px; min-width: 0; }
    .biz-info .n { font-size: 15px; font-weight: 700; }
    .biz-info .lvl { font-size: 11px; color: #fde047; font-weight: 700; }
    .biz-info .ps { font-size: 12px; color: #86efac; margin-top: 2px; }
    .biz-btn { min-width: 122px; }
    .biz-btn.own { background: linear-gradient(180deg, #2563eb, #1d4ed8); border-color: #60a5fa; box-shadow: 0 3px 10px rgba(59,130,246,.25); }

    .offline {
      background: linear-gradient(90deg, #1e3a8a, #312e81);
      border: 1px solid #60a5fa; border-radius: 16px;
      padding: 16px; text-align: center; margin-bottom: 12px;
    }
    .offline h3 { font-size: 18px; margin-bottom: 6px; }
    .offline .am { font-size: 26px; font-weight: 800; color: #fde047; margin: 6px 0 12px; }
    .offline .btns { display: flex; gap: 10px; justify-content: center; }
    .offline .btns .buy-btn { min-width: 0; flex: 1; }
    .hidden { display: none !important; }

    .toast {
      position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
      background: rgba(8,31,25,.95); border: 1px solid #22c55e; color: #bbf7d0;
      padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50;
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; }

    #fxLayer { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
    .fx { position: absolute; background-repeat: no-repeat; pointer-events: none; }

    .tap-btn.pulse { animation: tapPulse 2s ease-in-out infinite; }
    .tap-btn.boost-glow { box-shadow: 0 0 0 6px rgba(253,224,71,.35), 0 10px 34px rgba(245,158,11,.55); }
    @keyframes tapPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .board-card { animation: popIn .25s ease-out; }
    @keyframes popIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .daily-btn:not(:disabled) { animation: dailyShimmer 3s ease-in-out infinite; }
    @keyframes dailyShimmer { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      .tap-btn.pulse, .daily-btn:not(:disabled), .board-card { animation: none; }
    }

    .bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: rgba(7,26,20,.97); border-top: 1px solid #1e563f;
      display: flex; justify-content: space-around; padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: #86efac; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .nav-btn .e { font-size: 24px; }
    .nav-btn:disabled { opacity: .45; cursor: default; }

    .board-pop {
      position: fixed; inset: 0; background: rgba(0,0,0,.65);
      display: flex; align-items: center; justify-content: center; z-index: 60;
    }
    .board-card {
      width: 88%; max-width: 380px; max-height: 70vh; overflow-y: auto;
      background: #0d2b22; border: 1px solid #22c55e; border-radius: 18px; padding: 18px;
    }
    .board-card h3 { text-align: center; margin-bottom: 10px; font-size: 18px; }
    .board-card .row { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px dashed #1e563f; font-size: 14px; }
    .board-card .me { color: #fde047; font-weight: 800; }
    .board-card .close {
      width: 100%; margin-top: 12px; padding: 12px;
      background: #166534; border: 1px solid #22c55e; color: #bbf7d0;
      border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="money"><small>💰</small> <span id="money">0</span></div>
      <div class="total" id="total">Всего заработано: 0</div>
      <div class="pills">
        <div class="pill gold" id="boostPill">🚀 Доход ×2</div>
        <div class="pill" id="offlinePill">💤 Накоплено офлайн</div>
      </div>
    </header>

    <div class="tap-wrap" id="tapWrap">
      <button class="tap-btn" id="tapBtn" type="button">
        <div class="ico" id="tapIcon">🥤</div>
        <div class="lbl" id="tapLabel">Заработать</div>
      </button>
    </div>

    <button class="daily-btn" id="dailyBtn" type="button">
      <span>🎁 Ежедневная награда</span>
      <span class="d" id="dailyInfo">1-й день</span>
    </button>

    <div class="click-row">
      <div class="t">👆 Сила клика <span id="clickLvl">×1</span></div>
      <button class="buy-btn" id="clickUpgradeBtn" type="button">Купить</button>
    </div>

    <div class="biz-list" id="bizList"></div>
  </div>

  <div class="offline hidden" id="offlineBox">
    <h3>💤 Вы отсутствовали</h3>
    <div class="am" id="offlineAmt">0</div>
    <div class="btns">
      <button class="buy-btn" id="offlineClaim" type="button">Забрать</button>
      <button class="buy-btn" id="offlineTriple" type="button">🎬 ×3 за рекламу</button>
    </div>
  </div>

  <nav class="bottom-bar">
    <button class="nav-btn" id="adBtn" type="button"><span class="e">🚀</span>Доход ×2<br>на 30 мин</button>
    <button class="nav-btn" id="boardBtn" type="button"><span class="e">🏆</span>Лидерборд</button>
    <button class="nav-btn" id="saveBtn" type="button"><span class="e">💾</span>Сохранить</button>
    <button class="nav-btn" id="muteBtn" type="button"><span class="e">🔊</span>Звук</button>
  </nav>

  <div class="toast" id="toast"></div>
  <div id="fxLayer"></div>
  <div class="board-pop hidden" id="boardPop">
    <div class="board-card">
      <h3>🏆 Богатейшие магнаты</h3>
      <div id="boardRows"></div>
      <button class="close" id="boardClose" type="button">Закрыть</button>
    </div>
  </div>

  <script src="/sdk.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
